<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brian's Recipe Finder</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <button class="home-btn" id="home-button">Home</button>
            </div>

            <div class="header-title">
                <h1>Brian's Recipe Finder</h1>

                <!-- Search bar with a search button -->
                <div class="search-container">
                    <input type="text" maxlength="50" id="search-input" placeholder="Search">
                    <a>
                        <button type="button" id="search-button">Search</button>
                    </a>
                </div>
            </div>

            <div class="header-actions">
                <button class="all-recipes-button" id="all-recipes-button">All Recipes</button>
            </div>
        </header>   


        <section class="content">
            <section class="suggested-recipes">
                <h3>Suggested Recipes</h3>
                <ul id="suggested-recipes-list"></ul>
                <!-- Suggested recipes will be dynamically added here -->
            </section>

            <!-- TODO add recent recipes -->
            <section id="recently-viewed-recipes" class="recently-viewed-recipes">
                <h3>Recent Recipes</h3>
                <ol id="recently-viewed-recipes-list"></ol>
                <!-- Recent recipes will be dynamically added here -->
            </section>
        </section>

        <!-- Footer 
        <footer id="contact">
            <p>Contact me at: <a href="mailto:brian@example.com">brian@example.com</a></p>
            <p>Call me at: <a href="tel:+1234567890">+1 (234) 567-890</a></p>
            <p>&copy; 2026 Brian Xiong. All rights reserved.</p>
        </footer>-->
    </body>

    <script src="app.js" defer></script>
</html>
