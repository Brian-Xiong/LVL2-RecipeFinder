<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brian's Recipe Finder</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <button class="home-btn" id="home-button">Home</button>
            </div>

            <div class="header-title">
                <h1>Brian's Recipe Finder</h1>

                <!-- Search bar with a search button -->
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <input type="text" maxlength="50" id="search-input" placeholder="Search" autocomplete="off">
                        <ul id="search-list" class="search-list"></ul>
                    </div>
                <button type="button" id="search-button">Search</button>
                </div>
            </div>

            <div class="header-actions">
                <button class="all-recipes-button" id="all-recipes-button">All Recipes</button>
            </div>
        </header>   

        <div class="contact-section">
            <h1>Contact</h1>
            <p class="contact-subheader">Please leave any questions, comments, or concerns below</p>
            
            <form class="contact-form">
                <div class="name-field">
                    <label class="name-label">
                        <span>Name</span>
                    </label>
                    <input class="input" type="text" maxlength="50" id="name-input" placeholder="Name" autocomplete="off">
                    <span class="error-text" id="name-error"></span>
                </div>

                <div class="email-field">
                    <label class="email-label">
                        <span>Email</span>
                    </label>
                    <input class ="input" required type="email" maxlength="50" id="email-input" placeholder="Email" autocomplete="off">
                    <span class="error-text" id="name-error"></span>
                </div>
                
                <div class="message-field">
                    <label class="message-label">
                        <span>Message</span>
                    </label>
                    <textarea class="message-textarea" type="text" maxlength="50" id="message-textarea" placeholder="Message" autocomplete="off"></textarea>
                    <span class="error-text" id="name-error"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="send-message-button" id="send-message-button">Send Message</button>
                </div>
            </form>
        </div>
    </body>
    <script src="contact.js" defer></script>
    <script src="app.js" defer></script>

</html>
