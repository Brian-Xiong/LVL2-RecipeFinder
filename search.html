<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brian's Recipe Finder</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <button class="home-btn" id="home-button">Home</button>
            </div>

            <div class="header-title">
                <h1>Brian's Recipe Finder</h1>

                <!-- Search bar with a search button -->
                <div class="search-container">
                    <input type="text" maxlength="50" id="search-input" placeholder="Search">
                    <a>
                        <button type="button" id="search-button" href="/recipe.html">Search</button>
                    </a>
                </div>
            </div>

            <div class="header-actions">
                <button class="all-recipes-btn" id="all-recipes-btn">All Recipes</button>
            </div>
        </header>   
    </body>
    <script src="app.js"></script>
</html>
