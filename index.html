<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brian's Recipe Finder</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <button class="home-btn" id="home-button">Home</button>
            </div>

            <div class="header-title">
                <h1>Brian's Recipe Finder</h1>

                <!-- Search bar with a search button -->
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <input type="text" maxlength="50" id="search-input" placeholder="Search" autocomplete="off">
                        <ul id="search-list" class="search-list"></ul>
                    </div>
                <button type="button" id="search-button">Search</button>
                </div>
            </div>

            <div class="header-actions">
                <button class="all-recipes-button" id="all-recipes-button">All Recipes</button>
            </div>
        </header>   

        <div class="home-container"> 
            <h2 style="font-size: 50px">Welcome to Brian's Recipe Finder!</h2>
            <p style="font-size: 25px" >Discover delicious recipes and find inspiration for your next meal.  You can search by recipe name or choose from a recipe below.</p>
        </div>

        <section class="content">
            <!-- suggested recipes -->
            <section class="suggested-recipes">
                <h3>Suggested Recipes</h3>
                <ul id="suggested-recipes-list"></ul>
                <!-- Suggested recipes will be dynamically added here -->
            </section>

            <!--  recently viewed recipes -->
            <section id="recently-viewed-recipes" class="recently-viewed-recipes">
                <h3>Recently Viewed Recipes</h3>
                <ol id="recently-viewed-recipes-list"></ol>
                <!-- Recent recipes will be dynamically added here -->
            </section>
        </section>

        <!-- Footer -->

        <footer id="footer">
            <button class="contact-btn" id="contact-button">Contact</button>
            <!--
            <p>Contact me at: <a href="mailto:bxiong1000@gmail.com">bxiong1000@gmail.com</a></p>
            <p>Call me at: <a href="tel:+4409413412">+1 (440) 941-3412</a></p>
            -->
            <p>&copy; 2026 Brian Xiong. All rights reserved.</p>
        </footer>
    </body>

    <script src="index.js" defer></script>
    <script src="app.js" defer></script>
</html>
