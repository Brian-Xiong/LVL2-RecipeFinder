<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brian's Recipe Finder</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <button class="home-btn" id="home-button">Home</button>
            </div>

            <div class="header-title">
                <h1>Brian's Recipe Finder</h1>
                <div class="search-container">
                    <input type="text" maxlength="50" id="search-input" placeholder="Search">
                    <button id="search-button">Search</button>
                </div>
            </div>

            <div class="header-actions">
                <button class="all-recipes-btn" id="all-recipes-btn">All Recipes</button>
            </div>
        </header>   

        <div class="container"> 
            <h2>Welcome to Brian's Recipe Finder!</h2>
            <p>Discover delicious recipes and find inspiration for your next meal.  You can search by recipe name, ingredients, or cuisine.</p>
        </div>



        <section class="content">
            <!-- Search bar with a search button -->
            <div class="section-block">
                <input type="text" maxlength="50" id="search-input" placeholder="Enter recipe name or ingredient">
                <button id="searchButton">Search</button>
            </div>

            <!-- TODO add suggested recipes !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!-->
            <div class="section-block">
                <h3>Suggested Recipes</h3>
                <ul id="suggested-recipes-list"></ul>
                <!-- Suggested recipes will be dynamically added here -->
            </div>

            <!-- TODO add recent recipes -->
            <div class="section-block">
                <h3>Recent Recipes</h3>
                <ul id="recent-recipes-list"></ul>
                <!-- Recent recipes will be dynamically added here -->
            </div>

        </section>

</html>
