<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brian's Recipe Finder - Recipe Details</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- Header -->
        <header>
            <div class="header-left">
                <button class="home-btn" id="home-button">Home</button>
            </div>

            <div class="header-title">
                <h1>Brian's Recipe Finder</h1>
                <div class="search-container">
                    <input type="text" maxlength="50" id="search-input" placeholder="Search">
                    <button id="search-button">Search</button>
                </div>
            </div>

            <div class="header-actions">
                <button class="all-recipes-btn" id="all-recipes-btn">All Recipes</button>
            </div>
        </header>
    
        <!-- CREATE PAGE WITH TEST INFORMATION  -->
         <main>
            <section class="recipe-details">
                <h2 id="recipe-name"></h2>
                <p id="recipe-tags">Recipe tags</p>
                
                <!-- Recipe Image will be dynamically added here -->
                <img id="recipe-image">

                <p id="recipe-description"></p>
                <h3>Ingredients:</h3>
                <ul id="ingredients-list">
                    <!-- Ingredients will be dynamically added here -->
                </ul>
                <h3>Instructions:</h3>
                <ol id="instructions-list">
                    <!-- Instructions will be dynamically added here -->
                </ol>
            </section>



            <!-- Recommended Recipes -->
            <section class="recommended-recipes" id = "recommended-recipes">
                <h3>Recommended Recipes</h3>
                <ul id="recommended-recipes-list" class="recommended-recipe-list">
                    <!-- Recommended recipes will be dynamically added here -->
                </ul>
            </section>


            <!-- Recently Viewed Recipes -->
            <section id="recently-viewed-recipes" class="recently-viewed-recipes">
                <h3>Recently Viewed Recipes</h3>
                <ol id="recently-viewed-recipes-list" class="recently-viewed-recipe-list">
                    <!-- Recently viewed recipes will be dynamically added here -->
                </ol>
            </section>

        </main>
        <script src="recipe.js" defer></script>
        <script src="app.js" defer></script>
    </body>
</html>
